[project]
name = "ai-news-mcp"
version = "0.1.0"
description = "Daily AI news from Hacker News, served to Claude Desktop over MCP."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
ai-news-mcp = "ai_news_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"
